l_japanese:
 je_auto_fund_lobbies: "圧力団体への自動資金提供"
 je_auto_fund_lobbies_reason: "自動化が有効な間、保護された予備量を超える[concept_influence]は国外で活用されます。毎週、最も適した国と「[concept_fund_lobbies]」協定をひとつ新たに締結し、我が国に友好的な[Concept('concept_political_lobby','$concept_political_lobbies$')]を強化します。\n\n利用可能な[concept_influence]が予備量を下回った場合、予備量が回復するまで自動協定を週にひとつずつ解消します。手動で締結した協定には決して手を付けません。また、新たな協定は国庫が無借金で週間収支が黒字の間のみ締結されます。\n\n保護された予備量：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]（#v 50#!～#v 500#!の間で調整可能）"
 je_auto_fund_lobbies_status_enabled: "自動化：#P 有効#! — 保護された予備量：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "自動化：#N 無効#! — 保護された予備量：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 afl_button_enable: "自動化を有効にする"
 afl_button_enable_desc: "保護された予備量を超える[concept_influence]を、新たな「[concept_fund_lobbies]」協定に使い始めます。"
 afl_button_disable: "自動化を無効にする"
 afl_button_disable_desc: "新たな自動協定の締結を停止します。既存の協定は維持され、外交画面から手動で解消できます。"
 afl_button_reserve_up: "予備量を増やす（+50）"
 afl_button_reserve_up_desc: "保護された[concept_influence]の予備量を#v 50#!増やします（最大#v 500#!）。現在の予備量：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "予備量を減らす（-50）"
 afl_button_reserve_down_desc: "保護された[concept_influence]の予備量を#v 50#!減らします（最小#v 50#!）。現在の予備量：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "今すぐ確認"
 afl_button_run_now_desc: "毎週の処理を待たずに、自動化の判定を直ちに1回実行します。カーソルを合わせると、実行される内容を確認できます。"
 fund_lobbies_effect_desc_first: "「[concept_fund_lobbies]」協定を締結する"
 je_auto_fund_lobbies_status_created: "自動化：#P 有効#! — 直近の確認で新たな協定を締結しました。"
 je_auto_fund_lobbies_status_stuck: "自動化：#P 有効#! — 有効な対象が見つかりましたが、協定を締結できませんでした。この問題を報告してください。"
 je_auto_fund_lobbies_status_defunded: "自動化：#P 有効#! — 保護された予備量を回復するため、協定をひとつ解消しました。"
 je_auto_fund_lobbies_status_cantafford: "自動化：#P 有効#! — 対象となる国はありますが、利用可能な[concept_influence]がいずれのしきい値にも達していません。"
 je_auto_fund_lobbies_status_nocandidate: "自動化：#P 有効#! — 現在、資金提供できる対象国がありません。"
 je_auto_fund_lobbies_status_blocked: "自動化：#P 有効#! — 一時停止中：財政悪化、中央銀行の未研究、悪名が高い、または[concept_influence]が予備量を下回っています。"
 je_auto_fund_lobbies_status_notrun: "自動化：#P 有効#! — 最初の確認を待っています（ポーズを解除するか「今すぐ確認」を押してください）。"
