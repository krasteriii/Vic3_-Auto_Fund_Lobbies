l_polish:
 je_auto_fund_lobbies: "Automatyczne finansowanie lobby"
 je_auto_fund_lobbies_reason: "Dopóki automatyzacja jest włączona, [Concept('concept_influence','Wpływ')] powyżej chronionej rezerwy jest wykorzystywany za granicą: co tydzień zawierany jest jeden nowy pakt „[concept_fund_lobbies]” z najodpowiedniejszym państwem, co wzmacnia przychylne nam [Concept('concept_political_lobby','lobby polityczne')].\n\nJeśli dostępny [Concept('concept_influence','Wpływ')] spadnie poniżej rezerwy, automatyczne pakty są anulowane po jednym na tydzień, aż rezerwa zostanie odtworzona. Pakty zawarte ręcznie nigdy nie są naruszane, a nowe pakty powstają tylko wtedy, gdy tygodniowy bilans jest dodatni, dług pozostaje niski, a niesława nie jest wysoka.\n\nChroniona rezerwa: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [Concept('concept_influence','Wpływu')] (regulowana od #v 50#! do #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automatyzacja #P włączona#! — chroniona rezerwa: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [Concept('concept_influence','Wpływu')]"
 je_auto_fund_lobbies_status_disabled: "Automatyzacja #N wyłączona#! — chroniona rezerwa: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [Concept('concept_influence','Wpływu')]"
 afl_button_enable: "Włącz automatyzację"
 afl_button_enable_desc: "Zacznij przeznaczać [Concept('concept_influence','Wpływ')] powyżej chronionej rezerwy na nowe pakty „[concept_fund_lobbies]”."
 afl_button_disable: "Wyłącz automatyzację"
 afl_button_disable_desc: "Przestań zawierać nowe automatyczne pakty. Istniejące pakty pozostają i można je anulować ręcznie w panelu dyplomacji."
 afl_button_reserve_up: "Zwiększ rezerwę (+50)"
 afl_button_reserve_up_desc: "Zwiększa chronioną rezerwę [Concept('concept_influence','Wpływu')] o #v 50#!, maksymalnie do #v 500#!. Obecna rezerwa: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Zmniejsz rezerwę (-50)"
 afl_button_reserve_down_desc: "Zmniejsza chronioną rezerwę [Concept('concept_influence','Wpływu')] o #v 50#!, minimalnie do #v 50#!. Obecna rezerwa: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Sprawdź teraz"
 afl_button_run_now_desc: "Natychmiast wykonuje jedną kontrolę automatyzacji, bez czekania na następny cotygodniowy cykl. Najedź kursorem, aby zobaczyć, co dokładnie zostanie zrobione."
 fund_lobbies_effect_desc_first: "Zawrzyj pakt „[concept_fund_lobbies]”"
 je_auto_fund_lobbies_status_created: "Automatyzacja #P włączona#! — ostatnia kontrola zawarła nowy pakt: [ROOT.GetCountry.MakeScope.Var('afl_last_funded').GetCountry.GetName]"
 je_auto_fund_lobbies_status_stuck: "Automatyzacja #P włączona#! — znaleziono właściwy cel, ale nie udało się zawrzeć paktu. Prosimy zgłosić ten problem."
 je_auto_fund_lobbies_status_defunded: "Automatyzacja #P włączona#! — anulowano pakt, aby odtworzyć chronioną rezerwę."
 je_auto_fund_lobbies_status_cantafford: "Automatyzacja #P włączona#! — istnieją odpowiednie państwa, ale dostępny [Concept('concept_influence','Wpływ')] jest poniżej progu dla każdego z nich."
 je_auto_fund_lobbies_status_nocandidate: "Automatyzacja #P włączona#! — obecnie brak odpowiedniego państwa do finansowania."
 je_auto_fund_lobbies_status_blocked: "Automatyzacja #P włączona#! — wstrzymana: zły stan skarbu, brak Banku centralnego, wysoka niesława lub [Concept('concept_influence','Wpływ')] poniżej rezerwy."
 je_auto_fund_lobbies_status_notrun: "Automatyzacja #P włączona#! — oczekiwanie na pierwszą kontrolę (wznów grę lub naciśnij Sprawdź teraz)."
