l_spanish:
 je_auto_fund_lobbies: "Financiación automática de lobbies"
 je_auto_fund_lobbies_reason: "Mientras la automatización esté activada, la [concept_influence] disponible por encima de la reserva protegida se pone a trabajar en el extranjero: cada semana se crea un nuevo pacto de [concept_fund_lobbies] con el país más adecuado, reforzando los [Concept('concept_political_lobby','$concept_political_lobbies$')] favorables a nosotros.\n\nSi nuestra [concept_influence] disponible cae por debajo de la reserva, los pactos automáticos se cancelan uno por semana hasta restaurar la reserva. Los pactos creados manualmente nunca se tocan, y solo se crean pactos nuevos mientras el tesoro esté libre de deudas y con balance semanal positivo.\n\nReserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence] (ajustable de #v 50#! a #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automatización #P activada#! — reserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "Automatización #N desactivada#! — reserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence]"
 afl_button_enable: "Activar automatización"
 afl_button_enable_desc: "Empezar a gastar la [concept_influence] disponible por encima de la reserva protegida en nuevos pactos de [concept_fund_lobbies]."
 afl_button_disable: "Desactivar automatización"
 afl_button_disable_desc: "Dejar de crear nuevos pactos automáticos. Los pactos existentes se conservan y pueden cancelarse manualmente desde el panel de Diplomacia."
 afl_button_reserve_up: "Aumentar reserva (+50)"
 afl_button_reserve_up_desc: "Aumenta la reserva protegida de [concept_influence] en #v 50#!, hasta un máximo de #v 500#!. Reserva actual: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Reducir reserva (-50)"
 afl_button_reserve_down_desc: "Reduce la reserva protegida de [concept_influence] en #v 50#!, hasta un mínimo de #v 50#!. Reserva actual: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Comprobar ahora"
 afl_button_run_now_desc: "Ejecuta inmediatamente una comprobación de la automatización, sin esperar al siguiente ciclo semanal. Pasa el cursor para ver exactamente qué hará."
 fund_lobbies_effect_desc_first: "Establecer un pacto de [concept_fund_lobbies]"
 je_auto_fund_lobbies_status_created: "Automatización #P activada#! — la última comprobación estableció un nuevo pacto."
 je_auto_fund_lobbies_status_stuck: "Automatización #P activada#! — se encontró un objetivo válido, pero el pacto no pudo crearse. Por favor, informa de este problema."
 je_auto_fund_lobbies_status_defunded: "Automatización #P activada#! — se canceló un pacto para restaurar la reserva protegida."
 je_auto_fund_lobbies_status_cantafford: "Automatización #P activada#! — existen países elegibles, pero la [concept_influence] disponible está por debajo del umbral para todos ellos."
 je_auto_fund_lobbies_status_nocandidate: "Automatización #P activada#! — no hay ningún país elegible que financiar ahora mismo."
 je_auto_fund_lobbies_status_blocked: "Automatización #P activada#! — en pausa: tesoro en mal estado, falta Banca Central, infamia alta o [concept_influence] por debajo de la reserva."
 je_auto_fund_lobbies_status_notrun: "Automatización #P activada#! — esperando la primera comprobación (reanuda la partida o pulsa Comprobar ahora)."
 afl_button_debug_test: "Depuración: prueba de pacto"
 afl_button_debug_test_desc: "Diagnóstico temporal: crea un pacto de Mejorar relaciones con el mejor candidato de la automatización y un pacto de Financiar lobbies con Birmania. Después comprueba el panel de Diplomacia e informa de cuál de los dos apareció."
