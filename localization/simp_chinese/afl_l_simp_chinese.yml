l_simp_chinese:
 je_auto_fund_lobbies: "自动资助游说团"
 je_auto_fund_lobbies_reason: "自动化启用期间，超出受保护储备的[concept_influence]将被用于海外：每周与最合适的国家缔结一份新的“[concept_fund_lobbies]”协定，以壮大对我们友好的[Concept('concept_political_lobby','$concept_political_lobbies$')]。\n\n若可用[concept_influence]低于储备，将每周取消一份自动协定，直至储备恢复。手动缔结的协定绝不会受到影响；只有在周收支为正、债务较低且恶名不高时才会缔结新协定。\n\n受保护储备：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]（可在#v 50#!至#v 500#!之间调整）"
 je_auto_fund_lobbies_status_enabled: "自动化#P 已启用#! — 受保护储备：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "自动化#N 已禁用#! — 受保护储备：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 afl_button_enable: "启用自动化"
 afl_button_enable_desc: "开始将超出受保护储备的[concept_influence]用于新的“[concept_fund_lobbies]”协定。"
 afl_button_disable: "禁用自动化"
 afl_button_disable_desc: "停止缔结新的自动协定。现有协定将保留，可在外交界面手动取消。"
 afl_button_reserve_up: "提高储备（+50）"
 afl_button_reserve_up_desc: "将受保护的[concept_influence]储备提高#v 50#!，最高#v 500#!。当前储备：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "降低储备（-50）"
 afl_button_reserve_down_desc: "将受保护的[concept_influence]储备降低#v 50#!，最低#v 50#!。当前储备：#v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "立即检查"
 afl_button_run_now_desc: "立即执行一次自动化检查，无需等待每周结算。悬停可预览将要执行的操作。"
 fund_lobbies_effect_desc_first: "缔结“[concept_fund_lobbies]”协定"
 je_auto_fund_lobbies_status_created: "自动化#P 已启用#! — 最近一次检查与[ROOT.GetCountry.MakeScope.Var('afl_last_funded').GetCountry.GetName]缔结了一份新协定。"
 je_auto_fund_lobbies_status_stuck: "自动化#P 已启用#! — 找到了有效目标，但未能缔结协定。请报告此问题。"
 je_auto_fund_lobbies_status_defunded: "自动化#P 已启用#! — 已取消一份协定以恢复受保护储备。"
 je_auto_fund_lobbies_status_cantafford: "自动化#P 已启用#! — 存在符合条件的国家，但可用[concept_influence]低于所有目标的门槛。"
 je_auto_fund_lobbies_status_nocandidate: "自动化#P 已启用#! — 当前没有可资助的国家。"
 je_auto_fund_lobbies_status_blocked: "自动化#P 已启用#! — 已暂停：国库状况不佳、缺少中央银行、恶名过高或[concept_influence]低于储备。"
 je_auto_fund_lobbies_status_notrun: "自动化#P 已启用#! — 等待首次检查（取消暂停或点击立即检查）。"
