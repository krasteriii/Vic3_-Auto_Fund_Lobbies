l_german:
 je_auto_fund_lobbies: "Automatische Lobbyfinanzierung"
 je_auto_fund_lobbies_reason: "Solange die Automatisierung aktiviert ist, wird verfügbarer [concept_influence] oberhalb der geschützten Reserve im Ausland eingesetzt: Jede Woche wird ein neuer „[concept_fund_lobbies]“-Pakt mit dem geeignetsten Land geschlossen, wodurch uns wohlgesonnene [Concept('concept_political_lobby','$concept_political_lobbies$')] gestärkt werden.\n\nFällt unser verfügbarer [concept_influence] unter die Reserve, werden automatische Pakte einer pro Woche aufgelöst, bis die Reserve wiederhergestellt ist. Manuell geschlossene Pakte werden nie angetastet, und neue Pakte werden nur geschlossen, solange die Staatskasse schuldenfrei ist und die Wochenbilanz positiv ausfällt.\n\nGeschützte Reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence] (einstellbar von #v 50#! bis #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automatisierung #P aktiviert#! — geschützte Reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "Automatisierung #N deaktiviert#! — geschützte Reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 afl_button_enable: "Automatisierung aktivieren"
 afl_button_enable_desc: "Beginnt, verfügbaren [concept_influence] oberhalb der geschützten Reserve für neue „[concept_fund_lobbies]“-Pakte auszugeben."
 afl_button_disable: "Automatisierung deaktivieren"
 afl_button_disable_desc: "Es werden keine neuen automatischen Pakte mehr geschlossen. Bestehende Pakte bleiben erhalten und können manuell über das Diplomatiemenü aufgelöst werden."
 afl_button_reserve_up: "Reserve erhöhen (+50)"
 afl_button_reserve_up_desc: "Erhöht die geschützte [concept_influence]-Reserve um #v 50#!, bis zu einem Maximum von #v 500#!. Aktuelle Reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Reserve verringern (-50)"
 afl_button_reserve_down_desc: "Verringert die geschützte [concept_influence]-Reserve um #v 50#!, bis zu einem Minimum von #v 50#!. Aktuelle Reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Jetzt prüfen"
 afl_button_run_now_desc: "Führt sofort eine Automatisierungsprüfung durch, ohne auf den nächsten Wochenimpuls zu warten. Beim Überfahren wird genau angezeigt, was geschehen wird."
 fund_lobbies_effect_desc_first: "Einen „[concept_fund_lobbies]“-Pakt schließen"
 je_auto_fund_lobbies_status_created: "Automatisierung #P aktiviert#! — die letzte Prüfung hat einen neuen Pakt mit [ROOT.GetCountry.MakeScope.Var('afl_last_funded').GetCountry.GetName] geschlossen."
 je_auto_fund_lobbies_status_stuck: "Automatisierung #P aktiviert#! — ein gültiges Ziel wurde gefunden, aber der Pakt konnte nicht geschlossen werden. Bitte melden Sie dieses Problem."
 je_auto_fund_lobbies_status_defunded: "Automatisierung #P aktiviert#! — ein Pakt wurde aufgelöst, um die geschützte Reserve wiederherzustellen."
 je_auto_fund_lobbies_status_cantafford: "Automatisierung #P aktiviert#! — es gibt geeignete Länder, aber der verfügbare [concept_influence] liegt für alle unter der Schwelle."
 je_auto_fund_lobbies_status_nocandidate: "Automatisierung #P aktiviert#! — derzeit kein geeignetes Land zum Finanzieren."
 je_auto_fund_lobbies_status_blocked: "Automatisierung #P aktiviert#! — pausiert: Staatskasse angeschlagen, Zentralbank fehlt, hohe Schande oder [concept_influence] unter der Reserve."
 je_auto_fund_lobbies_status_notrun: "Automatisierung #P aktiviert#! — wartet auf die erste Prüfung (Spiel fortsetzen oder Jetzt prüfen drücken)."
