l_english:
 je_auto_fund_lobbies: "Automated Lobby Funding"
 je_auto_fund_lobbies_reason: "While automation is enabled, spare [concept_influence] above the protected reserve is put to work abroad: each week, one new [concept_fund_lobbies] pact is created with the most suitable country, strengthening [Concept('concept_political_lobby','$concept_political_lobbies$')] friendly to us.\n\nIf our available [concept_influence] falls below the reserve, automated pacts are cancelled one per week until the reserve is restored. Pacts created manually are never touched, and new pacts are only created while the treasury is debt-free with a positive weekly balance.\n\nProtected reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence] (adjustable from #v 50#! to #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automation #P enabled#! — protected reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "Automation #N disabled#! — protected reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 afl_button_enable: "Enable Automation"
 afl_button_enable_desc: "Start spending spare [concept_influence] above the protected reserve on new [concept_fund_lobbies] pacts."
 afl_button_disable: "Disable Automation"
 afl_button_disable_desc: "Stop creating new automated pacts. Existing pacts are kept and can be cancelled manually from the Diplomacy panel."
 afl_button_reserve_up: "Raise Reserve (+50)"
 afl_button_reserve_up_desc: "Increase the protected [concept_influence] reserve by #v 50#!, up to a maximum of #v 500#!. Current reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Lower Reserve (-50)"
 afl_button_reserve_down_desc: "Decrease the protected [concept_influence] reserve by #v 50#!, down to a minimum of #v 50#!. Current reserve: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Check Now"
 afl_button_run_now_desc: "Runs one automation check immediately, without waiting for the next weekly tick. Hover to preview exactly what it will do."
 fund_lobbies_effect_desc_first: "Establish a [concept_fund_lobbies] pact"
 je_auto_fund_lobbies_status_created: "Automation #P enabled#! — the last check established a new pact."
 je_auto_fund_lobbies_status_stuck: "Automation #P enabled#! — a valid target was found but the pact could not be created. Please report this."
 je_auto_fund_lobbies_status_defunded: "Automation #P enabled#! — a pact was cancelled to restore the protected reserve."
 je_auto_fund_lobbies_status_cantafford: "Automation #P enabled#! — eligible countries exist, but spare [concept_influence] is below the threshold for all of them."
 je_auto_fund_lobbies_status_nocandidate: "Automation #P enabled#! — no eligible country to fund right now."
 je_auto_fund_lobbies_status_blocked: "Automation #P enabled#! — paused: unhealthy treasury, missing Central Banking, high infamy, or [concept_influence] below the reserve."
 je_auto_fund_lobbies_status_notrun: "Automation #P enabled#! — waiting for the first check (unpause, or press Check Now)."
 afl_button_debug_test: "Debug: Pact Test"
 afl_button_debug_test_desc: "Temporary diagnostic: creates an Improve Relations pact with the automation's top candidate, and a Fund Lobbies pact with Burma. Check the Diplomacy panel afterwards and report which of the two appeared."
