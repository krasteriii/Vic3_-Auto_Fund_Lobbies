l_french:
 je_auto_fund_lobbies: "Financement automatique des lobbies"
 je_auto_fund_lobbies_reason: "Tant que l'automatisation est activée, l'[concept_influence] disponible au-delà de la réserve protégée est mise à profit à l'étranger : chaque semaine, un nouveau pacte « [concept_fund_lobbies] » est conclu avec le pays le plus approprié, renforçant les [Concept('concept_political_lobby','$concept_political_lobbies$')] qui nous sont favorables.\n\nSi notre [concept_influence] disponible passe sous la réserve, les pactes automatiques sont annulés un par semaine jusqu'à ce que la réserve soit rétablie. Les pactes conclus manuellement ne sont jamais touchés, et de nouveaux pactes ne sont conclus que si le solde hebdomadaire est positif, que la dette reste faible et que l'infamie n'est pas élevée.\n\nRéserve protégée : #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! d'[concept_influence] (réglable de #v 50#! à #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automatisation #P activée#! — réserve protégée : #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! d'[concept_influence]"
 je_auto_fund_lobbies_status_disabled: "Automatisation #N désactivée#! — réserve protégée : #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! d'[concept_influence]"
 afl_button_enable: "Activer l'automatisation"
 afl_button_enable_desc: "Commencer à consacrer l'[concept_influence] disponible au-delà de la réserve protégée à de nouveaux pactes « [concept_fund_lobbies] »."
 afl_button_disable: "Désactiver l'automatisation"
 afl_button_disable_desc: "Cesser de conclure de nouveaux pactes automatiques. Les pactes existants sont conservés et peuvent être annulés manuellement depuis le panneau de diplomatie."
 afl_button_reserve_up: "Augmenter la réserve (+50)"
 afl_button_reserve_up_desc: "Augmente la réserve protégée d'[concept_influence] de #v 50#!, jusqu'à un maximum de #v 500#!. Réserve actuelle : #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Réduire la réserve (-50)"
 afl_button_reserve_down_desc: "Réduit la réserve protégée d'[concept_influence] de #v 50#!, jusqu'à un minimum de #v 50#!. Réserve actuelle : #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Vérifier maintenant"
 afl_button_run_now_desc: "Exécute immédiatement une vérification de l'automatisation, sans attendre le prochain cycle hebdomadaire. Survolez pour voir exactement ce qui sera fait."
 fund_lobbies_effect_desc_first: "Conclure un pacte « [concept_fund_lobbies] »"
 je_auto_fund_lobbies_status_created: "Automatisation #P activée#! — la dernière vérification a conclu un nouveau pacte avec [ROOT.GetCountry.MakeScope.Var('afl_last_funded').GetCountry.GetName]."
 je_auto_fund_lobbies_status_stuck: "Automatisation #P activée#! — une cible valide a été trouvée, mais le pacte n'a pas pu être conclu. Merci de signaler ce problème."
 je_auto_fund_lobbies_status_defunded: "Automatisation #P activée#! — un pacte a été annulé pour rétablir la réserve protégée."
 je_auto_fund_lobbies_status_cantafford: "Automatisation #P activée#! — des pays éligibles existent, mais l'[concept_influence] disponible est sous le seuil pour chacun d'eux."
 je_auto_fund_lobbies_status_nocandidate: "Automatisation #P activée#! — aucun pays éligible à financer pour le moment."
 je_auto_fund_lobbies_status_blocked: "Automatisation #P activée#! — en pause : trésor en difficulté, Banque centrale manquante, infamie élevée ou [concept_influence] sous la réserve."
 je_auto_fund_lobbies_status_notrun: "Automatisation #P activée#! — en attente de la première vérification (reprenez la partie ou cliquez sur Vérifier maintenant)."
