l_braz_por:
 je_auto_fund_lobbies: "Financiamento Automático de Lobbies"
 je_auto_fund_lobbies_reason: "Enquanto a automação estiver ativada, a [concept_influence] disponível acima da reserva protegida é posta a trabalhar no exterior: a cada semana, um novo pacto de [concept_fund_lobbies] é criado com o país mais adequado, fortalecendo [Concept('concept_political_lobby','$concept_political_lobbies$')] favoráveis a nós.\n\nSe a nossa [concept_influence] disponível cair abaixo da reserva, os pactos automáticos são cancelados um por semana até a reserva ser restaurada. Pactos criados manualmente nunca são afetados, e novos pactos só são criados enquanto o saldo semanal for positivo, a dívida permanecer baixa e a infâmia não estiver alta.\n\nReserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence] (ajustável de #v 50#! a #v 500#!)."
 je_auto_fund_lobbies_status_enabled: "Automação #P ativada#! — reserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "Automação #N desativada#! — reserva protegida: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! de [concept_influence]"
 afl_button_enable: "Ativar Automação"
 afl_button_enable_desc: "Começar a gastar a [concept_influence] disponível acima da reserva protegida em novos pactos de [concept_fund_lobbies]."
 afl_button_disable: "Desativar Automação"
 afl_button_disable_desc: "Parar de criar novos pactos automáticos. Os pactos existentes são mantidos e podem ser cancelados manualmente no painel de Diplomacia."
 afl_button_reserve_up: "Aumentar Reserva (+50)"
 afl_button_reserve_up_desc: "Aumenta a reserva protegida de [concept_influence] em #v 50#!, até o máximo de #v 500#!. Reserva atual: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "Reduzir Reserva (-50)"
 afl_button_reserve_down_desc: "Reduz a reserva protegida de [concept_influence] em #v 50#!, até o mínimo de #v 50#!. Reserva atual: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "Verificar Agora"
 afl_button_run_now_desc: "Executa imediatamente uma verificação da automação, sem esperar o próximo ciclo semanal. Passe o mouse para ver exatamente o que será feito."
 fund_lobbies_effect_desc_first: "Estabelecer um pacto de [concept_fund_lobbies]"
 je_auto_fund_lobbies_status_created: "Automação #P ativada#! — a última verificação estabeleceu um novo pacto com [ROOT.GetCountry.MakeScope.Var('afl_last_funded').GetCountry.GetName]."
 je_auto_fund_lobbies_status_stuck: "Automação #P ativada#! — um alvo válido foi encontrado, mas o pacto não pôde ser criado. Por favor, informe este problema."
 je_auto_fund_lobbies_status_defunded: "Automação #P ativada#! — um pacto foi cancelado para restaurar a reserva protegida."
 je_auto_fund_lobbies_status_cantafford: "Automação #P ativada#! — existem países elegíveis, mas a [concept_influence] disponível está abaixo do limite para todos eles."
 je_auto_fund_lobbies_status_nocandidate: "Automação #P ativada#! — nenhum país elegível para financiar no momento."
 je_auto_fund_lobbies_status_blocked: "Automação #P ativada#! — pausada: tesouro em más condições, falta de Banco Central, infâmia alta ou [concept_influence] abaixo da reserva."
 je_auto_fund_lobbies_status_notrun: "Automação #P ativada#! — aguardando a primeira verificação (despause ou clique em Verificar Agora)."
