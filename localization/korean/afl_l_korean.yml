l_korean:
 je_auto_fund_lobbies: "자동 로비 자금 지원"
 je_auto_fund_lobbies_reason: "자동화가 활성화되어 있는 동안, 보호 예비량을 초과하는 [concept_influence](은)는 해외에서 활용됩니다. 매주 가장 적합한 국가와 새로운 [concept_fund_lobbies] 협정을 하나 체결하여, 우리에게 우호적인 [Concept('concept_political_lobby','$concept_political_lobbies$')](을)를 강화합니다.\n\n사용 가능한 [concept_influence](이)가 예비량 아래로 떨어지면, 예비량이 회복될 때까지 자동 협정을 매주 하나씩 취소합니다. 수동으로 체결한 협정은 절대 건드리지 않으며, 새 협정은 국고에 부채가 없고 주간 수지가 흑자일 때만 체결됩니다.\n\n보호 예비량: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence] (#v 50#!~#v 500#! 사이에서 조정 가능)"
 je_auto_fund_lobbies_status_enabled: "자동화 #P 활성화#! — 보호 예비량: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 je_auto_fund_lobbies_status_disabled: "자동화 #N 비활성화#! — 보호 예비량: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#! [concept_influence]"
 afl_button_enable: "자동화 활성화"
 afl_button_enable_desc: "보호 예비량을 초과하는 [concept_influence](을)를 새로운 [concept_fund_lobbies] 협정에 사용하기 시작합니다."
 afl_button_disable: "자동화 비활성화"
 afl_button_disable_desc: "새로운 자동 협정 체결을 중단합니다. 기존 협정은 유지되며 외교 화면에서 수동으로 취소할 수 있습니다."
 afl_button_reserve_up: "예비량 증가 (+50)"
 afl_button_reserve_up_desc: "보호되는 [concept_influence] 예비량을 #v 50#! 늘립니다(최대 #v 500#!). 현재 예비량: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_reserve_down: "예비량 감소 (-50)"
 afl_button_reserve_down_desc: "보호되는 [concept_influence] 예비량을 #v 50#! 줄입니다(최소 #v 50#!). 현재 예비량: #v [ROOT.GetCountry.MakeScope.Var('afl_min_influence').GetValue|v0]#!"
 afl_button_run_now: "지금 확인"
 afl_button_run_now_desc: "주간 처리를 기다리지 않고 자동화 검사를 즉시 1회 실행합니다. 마우스를 올리면 실행될 내용을 미리 볼 수 있습니다."
 fund_lobbies_effect_desc_first: "[concept_fund_lobbies] 협정 체결"
 je_auto_fund_lobbies_status_created: "자동화 #P 활성화#! — 최근 검사에서 새 협정을 체결했습니다."
 je_auto_fund_lobbies_status_stuck: "자동화 #P 활성화#! — 유효한 대상을 찾았지만 협정을 체결하지 못했습니다. 이 문제를 제보해 주세요."
 je_auto_fund_lobbies_status_defunded: "자동화 #P 활성화#! — 보호 예비량을 회복하기 위해 협정 하나를 취소했습니다."
 je_auto_fund_lobbies_status_cantafford: "자동화 #P 활성화#! — 대상 국가는 있지만 사용 가능한 [concept_influence](이)가 모든 기준치에 미치지 못합니다."
 je_auto_fund_lobbies_status_nocandidate: "자동화 #P 활성화#! — 현재 자금을 지원할 수 있는 국가가 없습니다."
 je_auto_fund_lobbies_status_blocked: "자동화 #P 활성화#! — 일시 중지: 국고 불안정, 중앙은행 미연구, 높은 악명 또는 [concept_influence] 예비량 미달."
 je_auto_fund_lobbies_status_notrun: "자동화 #P 활성화#! — 첫 검사를 기다리는 중입니다(일시정지를 해제하거나 지금 확인을 누르세요)."
